services:
  - type: web
    name: supervisor-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TOP_K
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false
